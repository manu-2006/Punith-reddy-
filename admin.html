<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin | Punith Reddy</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
body{overflow:hidden}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 500px at 80% 10%,rgba(255,153,51,.4),transparent 60%),linear-gradient(165deg,#0E4A36,#03110C)}
.lbox{width:min(420px,100%);background:var(--bg);border-radius:10px 10px 34px 10px;padding:34px;box-shadow:0 40px 80px -30px #000}
.lbox h1{font-size:1.7rem;font-weight:800;margin-bottom:4px}.err{color:#a11;font-weight:600;min-height:1.4em}
.shell{display:grid;grid-template-columns:260px 1fr;height:100vh}
.side{background:linear-gradient(180deg,#0B3B2B,#05180F);color:var(--on);padding:24px 14px;display:flex;flex-direction:column;gap:3px;overflow:auto;border-right:3px solid;border-image:linear-gradient(180deg,#FF9933,#F6C453,#138808) 1}
.brand{font-weight:800;font-size:1.25rem;margin:0 10px 18px;line-height:1.25}.brand small{display:block;font-weight:500;font-size:.85rem;color:var(--gold)}
.side button{font:inherit;text-align:left;border:0;background:none;color:inherit;opacity:.82;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.side button:hover{background:rgba(255,244,226,.09)}.side button.on{background:linear-gradient(90deg,#FF9933,#F6C453);color:#1F1611;opacity:1;font-weight:700}
.side .sp{flex:1}.side .out{border:1px solid rgba(255,244,226,.3)}
.amain{overflow:auto;padding:0 32px 80px}
.topb{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:16px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.topb h2{flex:1;font-size:1.5rem;font-weight:800;margin:0}.st{font-size:.88rem;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#138808;margin-right:6px}.dot.off{background:#c33}
.box{background:color-mix(in srgb,var(--saffron) 5%,var(--bg));border:1px solid var(--line);border-radius:6px 6px 22px 6px;padding:18px 20px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:22px}.tiles div{background:var(--card);border:1px solid var(--line);border-radius:6px 6px 22px 6px;padding:18px}.tiles b{display:block;font-size:2.2rem;color:var(--accent);line-height:1.1}.tiles span{color:var(--muted);font-size:.9rem}
.li{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li .tt{font-weight:700}.li .sm{color:var(--muted);font-size:.88rem}
.th{width:64px;height:48px;border-radius:8px;object-fit:cover;background:#0B3B2B;flex:none}
.bp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bp label>span{display:block;font-size:.8rem;font-weight:700;color:var(--accent);margin-bottom:4px}.bst{grid-column:1/-1;color:var(--muted);min-height:1.2em}
.fl{font-weight:700;margin:14px 0 6px;text-transform:capitalize}.fl:first-child{margin-top:0}
.up{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.up img{width:110px;height:76px;object-fit:cover;border-radius:10px}
.b2{display:inline-block;font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;border:2px solid var(--saffron);background:none;color:var(--ink);cursor:pointer}.b2.main{background:var(--saffron);color:#1F1611}.b2.red{border-color:#b33;color:#b33}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.sub button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:none;color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer}.sub button.on{background:var(--ink);color:var(--bg)}
.mbox{width:min(820px,100%)}
@media(max-width:860px){.shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:3px solid #FF9933}.brand{display:none}.side .sp{display:none}.amain{padding:0 14px 80px}.bp{grid-template-columns:1fr}}
.cam{position:relative;max-width:420px;margin:0 0 16px;border-radius:18px;overflow:hidden;background:#000;border:3px solid var(--saffron)}.cam video{display:block;width:100%}
.cam::after{content:"";position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.res{display:grid;gap:2px;padding:16px 20px;border-radius:14px;margin-top:14px;animation:mpop .3s}.res b{font-size:1.3rem}.res.ok{background:rgba(19,136,8,.16);border:1.5px solid #138808}.res.warn{background:rgba(246,196,83,.25);border:1.5px solid #c98a00}.res.bad{background:rgba(190,30,30,.14);border:1.5px solid #b33}
.rolechip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:rgba(255,153,51,.2);color:var(--accent);text-transform:capitalize}
.b2{border-radius:999px}.b2:hover{background:color-mix(in srgb,var(--saffron) 16%,transparent)}.b2.main:hover{background:var(--saffron);box-shadow:0 14px 28px -10px rgba(255,153,51,.85)}.b2.red:hover{background:rgba(179,38,30,.1)}
</style>
</head>
<body>
<div id="ldr" class="ldr" aria-live="polite"><div class="ld"><b>PR</b></div><div class="lbar"><i></i></div><p><span class="en">Loading</span><span class="kn">ಲೋಡ್ ಆಗುತ್ತಿದೆ</span></p></div>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/lib.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/admin.js"></script>
</body>
</html>
