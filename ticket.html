<style>
body{background:radial-gradient(700px 500px at 80% 0,rgba(255,153,51,.35),transparent 60%),linear-gradient(165deg,#0E4A36,#03110C);min-height:100vh;color:var(--on)}
.top2{display:flex;justify-content:space-between;align-items:center;padding:20px 0}.top2 a{text-decoration:none;font-weight:700}.top2 .lang button{color:var(--on)}
.tk{width:min(460px,100%);margin:10px auto 22px;color:#1F1611;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));animation:mpop .6s cubic-bezier(.2,.9,.3,1.1)}
.tk>div{background:#FFFAF2;position:relative}.tk .hd2{background:linear-gradient(135deg,#0B3B2B,#0E4A36);color:#FFF4E2;padding:0 24px 20px;border-radius:22px 22px 0 0;overflow:hidden}
.tk .tri{margin:0 -24px 52px}.brand2{display:flex;align-items:center;gap:12px}.brand2 b{display:grid;place-items:center;width:46px;height:46px;border-radius:50% 50% 10px 10px;background:linear-gradient(135deg,#FF9933,#F6C453);color:#1F1611;font-size:1.05rem}
.brand2 strong{display:block;font-size:1.15rem;line-height:1.2}.brand2 small{opacity:.85}.tag2{position:absolute;right:22px;top:22px;font-size:.72rem;letter-spacing:.14em;font-weight:800;color:#F6C453;border:1px solid rgba(246,196,83,.6);padding:4px 10px;border-radius:999px}
.tk .bd2{padding:24px 24px 18px}.tk h2{font-size:1.6rem;line-height:1.25;margin-bottom:14px}.tk dl{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0}.tk dt{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#B35200}.tk dd{margin:2px 0 0;font-weight:600}.tk .full{grid-column:1/-1}
.cut{height:30px;background:#FFFAF2;position:relative}.cut::before,.cut::after{content:"";position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:#07241A}.cut::before{left:-15px}.cut::after{right:-15px}
.cut i{position:absolute;left:24px;right:24px;top:50%;border-top:2px dashed rgba(31,22,17,.3)}
.qr2{padding:6px 24px 26px;text-align:center;border-radius:0 0 22px 22px}.qr2 canvas{width:min(250px,70%);height:auto;border-radius:14px;border:1px solid rgba(31,22,17,.12);padding:6px;background:#fff}.qr2 p{margin:10px 0 0;font-weight:700;letter-spacing:.2em;font-size:1.05rem}.qr2 small{display:block;color:#6A5D52;margin-top:4px}
.chk2{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:999px;background:rgba(19,136,8,.15);color:#0d6b05;font-weight:700}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding-bottom:50px}.acts .btn{color:var(--on)}.acts .btn.main{color:#1F1611}
.nf{text-align:center;padding:60px 0}.nf h1{font-size:2rem;margin-bottom:8px}
</style>
</head>

<div id="ldr" class="ldr" aria-live="polite"><div class="ld"><b>PR</b></div><div class="lbar"><i></i></div><p><span class="en">Loading</span><span class="kn">ಲೋಡ್ ಆಗುತ್ತಿದೆ</span></p></div>

<div id="app"></div></div>
